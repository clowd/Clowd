[package]
name = "prisc_recorder"
version = "0.11.0"
edition = "2021"
license = "GPL-2.0-or-later"

[dependencies]
prisc_obs = { workspace = true }
prisc_obs_sys = { workspace = true }
prisc_obs_platform = { workspace = true }
# The keyboard half of --input-capture: the observe stream of Prisc's one keyboard hook
# (src/input_hook.rs). The mouse hook stays local; prisc_hotkeys is keyboard only.
prisc_hotkeys = { workspace = true }
clap = { workspace = true, features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
# PNG encoding of the cursor_image sprite planes (cursor_sprite.rs).
image = { workspace = true, features = ["png"] }
libc = { workspace = true }

[target.'cfg(unix)'.dependencies]
# POSIX signal handling only; on Windows a native SetConsoleCtrlHandler is
# registered instead (ctrlc's HandlerRoutine returns immediately, which forfeits
# the CTRL_CLOSE grace period — see recorder.rs).
ctrlc = { workspace = true }

[target.'cfg(windows)'.dependencies]
# The imported recorder workspace's unified `windows` feature list, copied whole into each
# recorder crate that uses `windows`.
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    # Antialiased rounded shapes and text for the share-region prompt's own
    # painting (ui/win32.rs): plain GDI has neither.
    "Win32_Graphics_GdiPlus",
    # DwmSetWindowAttribute: dark window chrome, the Win11 Mica backdrop and the
    # caption/border colours that stand in for it elsewhere.
    "Win32_Graphics_Dwm",
    # CreateDXGIFactory1 + IDXGIAdapter1::EnumOutputs: mapping a monitor to the
    # graphics adapter that drives it, so obs_video_info.adapter can be set to
    # the GPU that owns the captured region (prisc_obs_platform region_adapter_index).
    "Win32_Graphics_Dxgi",
    # DXGI_OUTPUT_DESC (and the DXGI_MODE_DESC it embeds) sit behind the
    # _Common gate in the generated bindings.
    "Win32_Graphics_Dxgi_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    # WM_MOUSELEAVE: the prompt's own hover tracking for its OK button.
    "Win32_UI_Controls",
    # GetModuleHandleW: the HINSTANCE for RegisterClassW/CreateWindowExW.
    "Win32_System_LibraryLoader",
    # ExitProcess / GetCurrentThreadId (prisc_obs_platform exit_process, input hooks).
    "Win32_System_Threading",
    # RtlGetVersion + OSVERSIONINFOW: the real OS build number, used to resolve
    # --capture-method auto to WGC on Windows 11+ (prisc_obs_platform
    # resolve_capture_method). GetVersionExW/VerifyVersionInfoW report a
    # manifest-shimmed version instead, so ntdll's is the only usable one.
    "Wdk_System_SystemServices",
    "Win32_System_SystemInformation",
    # SetConsoleCtrlHandler (recorder.rs CTRL_CLOSE grace handling).
    "Win32_System_Console",
    # CoInitializeEx / CoCreateInstance + IMMDeviceEnumerator/IAudioEndpointVolume:
    # --speaker-volume-compensation endpoint-volume query (replaces the
    # hand-rolled COM vtables that windows-sys required).
    "Win32_System_Com",
    # IMMDevice::Activate's PROPVARIANT activation-params argument lives behind
    # these two gates in the generated bindings (we always pass None).
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# The input hook (input_hook.rs): the event tap's CFMachPort + run-loop plumbing;
# CFDate gates CFRunLoopRunInMode (CFTimeInterval lives in CFDate.h).
objc2-core-foundation = { workspace = true, features = ["CFMachPort", "CFRunLoop", "CFDate"] }
objc2-core-graphics = { workspace = true, features = ["CGEvent", "CGEventSource", "CGEventTypes"] }

[build-dependencies]
# Linux: stages the shared FFmpeg bundle (and, for prisc_recorder, libobs + plugins)
# next to the binary with $ORIGIN RUNPATHs.
prisc_build_support = { workspace = true }
