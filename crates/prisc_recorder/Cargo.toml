[package]
name = "obs-express"
version = "0.4.1"
edition = "2021"

[dependencies]
obs = { workspace = true }
obs-sys = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
libc = { workspace = true }

[target.'cfg(unix)'.dependencies]
# POSIX signal handling only; on Windows a native SetConsoleCtrlHandler is
# registered instead (ctrlc's HandlerRoutine returns immediately, which forfeits
# the CTRL_CLOSE grace period — see recorder.rs).
ctrlc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }
