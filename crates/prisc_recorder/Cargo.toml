[package]
name = "prisc_recorder"
version = "0.11.0"
edition = "2021"
license = "GPL-2.0-or-later"

[dependencies]
prisc_obs = { workspace = true }
prisc_obs_sys = { workspace = true }
prisc_obs_platform = { workspace = true }
# The keyboard half of --input-capture: the observe stream of Prisc's one keyboard hook
# (src/input_hook.rs). The mouse hook stays local; prisc_hotkeys is keyboard only.
prisc_hotkeys = { workspace = true }
clap = { workspace = true, features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
# PNG encoding of the cursor_image sprite planes (cursor_sprite.rs).
image = { workspace = true, features = ["png"] }
libc = { workspace = true }

[target.'cfg(unix)'.dependencies]
# POSIX signal handling only; on Windows a native SetConsoleCtrlHandler is
# registered instead (ctrlc's HandlerRoutine returns immediately, which forfeits
# the CTRL_CLOSE grace period — see recorder.rs).
ctrlc = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Only what this crate's own Windows code uses; the platform layer's features are
# declared in prisc_obs_platform.
windows = { workspace = true, features = [
    "Win32_Foundation",
    # The mouse hook (input_hook.rs): SetWindowsHookExW, its message loop and
    # GetCurrentThreadId for the shutdown PostThreadMessageW.
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    # SetConsoleCtrlHandler (recorder.rs CTRL_CLOSE grace handling).
    "Win32_System_Console",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# The input hook (input_hook.rs): the event tap's CFMachPort + run-loop plumbing;
# CFDate gates CFRunLoopRunInMode (CFTimeInterval lives in CFDate.h).
objc2-core-foundation = { workspace = true, features = ["CFMachPort", "CFRunLoop", "CFDate"] }
objc2-core-graphics = { workspace = true, features = ["CGEvent", "CGEventSource", "CGEventTypes"] }

[build-dependencies]
# Linux: stages the shared FFmpeg bundle (and, for prisc_recorder, libobs + plugins)
# next to the binary with $ORIGIN RUNPATHs.
prisc_build_support = { workspace = true }
