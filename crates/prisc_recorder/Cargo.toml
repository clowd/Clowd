[package]
name = "obs-express"
version = "0.1.0"
edition = "2021"

[dependencies]
obs = { path = "../obs" }
obs-sys = { path = "../obs-sys" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
libc = "0.2"

[target.'cfg(unix)'.dependencies]
# POSIX signal handling only; on Windows a native SetConsoleCtrlHandler is
# registered instead (ctrlc's HandlerRoutine returns immediately, which forfeits
# the CTRL_CLOSE grace period — see recorder.rs).
ctrlc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }
