[package]
name = "prisc_rust_core"
version = "1.0.0"
authors.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

# Only what the Rust binaries genuinely share: the coordinate space, the session.json
# contract, the exit codes the shell reads (re-exported from prisc_ipc), the Sentry setup that
# puts them all in one project under one release, and the desktop queries (windows, monitors,
# cursor) that the overlay, the scrolling driver and the recorder must answer the same way.
# app.manifest sits here for the same reason — it is what makes a process per-monitor DPI
# aware, and a drifted copy would silently make one binary photograph the wrong pixels.

# Each consumer names the modules it uses (the workspace entry turns default
# features off), so the Linux recorder stack, which does not report to Sentry,
# does not build the sentry/TLS tree, and prisc_ai, which reads no windows or
# monitors, does not link the desktop module's frameworks.
[features]
default = ["desktop", "telemetry"]
# The window list, monitors, DXGI outputs and the cursor.
desktop = ["dep:windows", "dep:objc2-core-foundation", "dep:objc2-core-graphics", "dep:objc2-app-kit"]
# The shared Sentry setup.
telemetry = ["dep:sentry"]

[dependencies]
prisc_ipc.workspace = true
anyhow.workspace = true
euclid.workspace = true
image = { workspace = true, features = ["png"] }
log.workspace = true
sentry = { workspace = true, optional = true }
serde.workspace = true

# The desktop module: window list, monitors, DXGI outputs and the cursor.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    # IVirtualDesktopManager for the overlay's current-desktop filter.
    "Win32_System_Com",
    "Win32_UI_Shell",
    # OpenProcess + QueryFullProcessImageNameW for window owner names.
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { workspace = true, optional = true, features = ["CFArray", "CFCGTypes", "CFData", "CFDictionary", "CFNumber", "CFString", "CFUUID"] }
objc2-core-graphics = { workspace = true, optional = true, features = [
    "CGDataProvider",
    "CGDirectDisplay",
    # CGDisplayIsMain and the display mode queries the shared screen list reads.
    "CGDisplayConfiguration",
    "CGError",
    "CGEvent",
    "CGEventSource",
    "CGEventTypes",
    "CGImage",
    # CGWarpMouseCursorPosition / CGAssociateMouseAndMouseCursorPosition; the
    # latter's binding also needs `libc` (boolean_t argument).
    "CGRemoteOperation",
    "CGWindow",
    "libc",
] }
# desktop::overlay sets the overlay level and collection behaviour on an NSWindow. Declared
# directly (not `workspace = true`) so default-features = false takes effect: the root entry is a
# bare version whose defaults prisc_capture relies on, and an inherited entry would silently keep
# them, compiling all of AppKit into every `cargo build -p prisc_interop`.
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = ["std", "NSResponder", "NSWindow"] }

[dev-dependencies]
serde_json.workspace = true
