[package]
name = "prisc_rust_core"
version = "1.0.0"
authors.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

# Only what the Rust binaries genuinely share: the coordinate space, the session.json
# contract, the exit codes the shell reads, the Sentry setup that puts them all in one
# project under one release, and the desktop queries (windows, monitors, cursor) that the
# overlay, the scrolling driver and the recorder must answer the same way.
# app.manifest sits here for the same reason — it is what makes a process per-monitor DPI
# aware, and a drifted copy would silently make one binary photograph the wrong pixels.

[dependencies]
anyhow.workspace = true
euclid.workspace = true
image = { workspace = true, features = ["png"] }
log.workspace = true
sentry.workspace = true
serde.workspace = true

# The desktop module: window list, monitors, DXGI outputs and the cursor.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    # IVirtualDesktopManager for the overlay's current-desktop filter.
    "Win32_System_Com",
    "Win32_UI_Shell",
    # OpenProcess + QueryFullProcessImageNameW for window owner names.
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { workspace = true, features = ["CFArray", "CFCGTypes", "CFDictionary", "CFNumber", "CFString", "CFUUID"] }
objc2-core-graphics = { workspace = true, features = [
    "CGDirectDisplay",
    "CGError",
    "CGEvent",
    "CGEventSource",
    "CGEventTypes",
    # CGWarpMouseCursorPosition / CGAssociateMouseAndMouseCursorPosition; the
    # latter's binding also needs `libc` (boolean_t argument).
    "CGRemoteOperation",
    "CGWindow",
    "libc",
] }

[dev-dependencies]
serde_json.workspace = true
