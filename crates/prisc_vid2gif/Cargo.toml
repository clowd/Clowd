[package]
name = "prisc_vid2gif"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"

[dependencies]
# The helper protocol (crates/prisc_capture/HELPER_PROTOCOL.md): stdio channel, the `job` catalog, lifetime.
prisc_ipc = { workspace = true }
clap = { workspace = true, features = ["derive"] }
anyhow = { workspace = true }
prisc_ffmpeg_sys = { workspace = true }

# Sentry: panics only (init_job), one project with the rest of Prisc. Not on Linux, where
# vid2gif is built in the manylinux image without the sentry/TLS tree (HELPER_PROTOCOL.md §3.4).
[target.'cfg(not(target_os = "linux"))'.dependencies]
prisc_rust_core = { workspace = true, features = ["telemetry"] }

[dev-dependencies]
# tests/cli.rs parses the protocol lines.
serde_json = { workspace = true }

[build-dependencies]
# Linux: stages the shared FFmpeg bundle (and, for prisc_recorder, libobs + plugins)
# next to the binary with $ORIGIN RUNPATHs.
prisc_build_support = { workspace = true }
