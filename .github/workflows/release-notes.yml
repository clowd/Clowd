name: Release Notes

# Generates user facing release notes for a commit range with an agentic model run, and
# optionally writes them into a release's description. release.yml calls this between the
# draft and publish jobs; the workflow_dispatch entry point exists so notes can be
# regenerated by hand for any range without touching a release.
# The prompt lives in .github/release-notes-prompt.md so it can be tweaked on its own.

on:
  workflow_call:
    inputs:
      from_sha:
        description: "Exclusive start of the range (the previous release's commit)"
        required: true
        type: string
      to_sha:
        description: "Inclusive end of the range (the commit being released)"
        required: true
        type: string
      release_tag:
        description: "Release whose description to overwrite; leave empty to only produce an artifact"
        required: false
        type: string
        default: ""
    secrets:
      OPENROUTER_KEY:
        required: true
  workflow_dispatch:
    inputs:
      from_sha:
        description: "Exclusive start of the range (sha, tag or ref)"
        required: true
        type: string
      to_sha:
        description: "Inclusive end of the range (sha, tag or ref)"
        required: true
        type: string
      release_tag:
        description: "Release whose description to overwrite; leave empty to only produce an artifact"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  notes:
    name: generate release notes
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      FROM_SHA: ${{ inputs.from_sha }}
      TO_SHA: ${{ inputs.to_sha }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      # Checked out at the ref the workflow runs from, not at to_sha, because the prompt is
      # read from here and an older to_sha predates it.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The agent reads the diff and the surrounding code, so it needs the whole history.
          fetch-depth: 0

      - name: Resolve range
        run: |
          # Accept tags and refs as well as raw shas, so a manual dispatch can name a release tag.
          git fetch --tags --force origin '+refs/heads/*:refs/remotes/origin/*' >/dev/null 2>&1 || true
          FROM=$(git rev-parse --verify "${FROM_SHA}^{commit}")
          TO=$(git rev-parse --verify "${TO_SHA}^{commit}")
          echo "FROM_SHA=$FROM" >> "$GITHUB_ENV"
          echo "TO_SHA=$TO" >> "$GITHUB_ENV"

          # The recorder's own history (its archived standalone repo, merged in whole as the second
          # parent of the import merge) already shipped to users inside the downloaded recorder, so
          # it never belongs in a release. Excluding its ancestors drops only that history: they
          # share no commits with the app's own, so this is safe for every range. The merge is
          # looked up by subject inside the range's own history, so a range whose end predates
          # the import finds none and excludes nothing, with no special case for it.
          IMPORT_MERGE=$(git rev-list -1 --merges \
            --grep='^Import obs-express-rs .* history into crates/$' "$TO")
          EXCLUDE=""
          if [ -n "$IMPORT_MERGE" ]; then
            EXCLUDE="^$(git rev-parse --verify "$IMPORT_MERGE^2")"
          fi
          echo "EXCLUDE=$EXCLUDE" >> "$GITHUB_ENV"

          # The release that ships the rename to Prisc gets a section announcing it: the commit
          # "Rename Clowd to Prisc in code and build the recorder in-repo", pinned by sha so a later
          # commit reusing that subject cannot take its place. Empty unless it is inside the range.
          # A missing object (a history rewrite, a shallow clone) fails the job rather than
          # silently dropping the section.
          RENAME_COMMIT=e851d1f2987d91101e92ef8b5a318390074e0eb7
          git cat-file -e "$RENAME_COMMIT^{commit}" \
            || { echo "::error::rename commit $RENAME_COMMIT not in history"; exit 1; }
          RENAME=""
          if git merge-base --is-ancestor "$RENAME_COMMIT" "$TO" \
            && ! git merge-base --is-ancestor "$RENAME_COMMIT" "$FROM"; then
            RENAME=$RENAME_COMMIT
          fi
          echo "RENAME_SHA=$RENAME" >> "$GITHUB_ENV"

          # EXCLUDE stays unquoted so that an empty value adds no argument
          COUNT=$(git rev-list --no-merges --count "$FROM..$TO" $EXCLUDE)
          echo "COMMIT_COUNT=$COUNT" >> "$GITHUB_ENV"
          echo "Range $FROM..$TO, $COUNT commits"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No commits between $FROM and $TO."
            exit 1
          fi

          # Keep the current prompt, then move the worktree to the released commit so the agent
          # reads the code as it shipped rather than whatever has landed since.
          cp .github/release-notes-prompt.md "$RUNNER_TEMP/prompt-instructions.md"
          git log --reverse --no-merges --date=short \
            --format='%H %ad %s%n%w(0,4,4)%b' "$FROM..$TO" $EXCLUDE > "$RUNNER_TEMP/commits.txt"
          git checkout --detach --force "$TO"
          cp "$RUNNER_TEMP/commits.txt" commits.txt

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Codex
        run: npm install -g @openai/codex@latest

      # Codex talks to OpenRouter as a custom provider; env_key names the variable it reads
      # the key from, so no codex login step is needed.
      - name: Configure Codex for OpenRouter
        run: |
          mkdir -p ~/.codex
          cat > ~/.codex/config.toml <<'EOF'
          model = "openai/gpt-5.6-sol"
          model_provider = "openrouter"
          model_reasoning_effort = "high"
          hide_agent_reasoning = true

          [model_providers.openrouter]
          name = "OpenRouter"
          base_url = "https://openrouter.ai/api/v1"
          env_key = "OPENROUTER_KEY"
          wire_api = "responses"
          EOF

      # The runner is ephemeral and the agent only reads this repository, so the sandbox
      # buys nothing here and blocks the gh api calls the prompt asks for.
      - name: Generate notes
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
        run: |
          {
            echo "Write the release notes for commit range \`$FROM_SHA..$TO_SHA\` of this"
            echo "repository ($COMMIT_COUNT commits). Follow these instructions exactly."
            if [ -n "$EXCLUDE" ]; then
              echo "Ignore every commit reachable from ${EXCLUDE#^}: that is the recorder's imported"
              echo "history, which already shipped. \`commits.txt\` is the authoritative list; when you"
              echo "run \`git log\` over the range yourself, append \`$EXCLUDE\` so those commits stay out."
            fi
            if [ -n "$RENAME_SHA" ]; then
              echo "This range ships the rename from Clowd to Prisc (commit $RENAME_SHA)."
            fi
            echo
            cat "$RUNNER_TEMP/prompt-instructions.md"
          } > prompt.txt

          codex exec \
            --dangerously-bypass-approvals-and-sandbox \
            --skip-git-repo-check \
            --output-last-message last-message.txt \
            "$(cat prompt.txt)"

      - name: Validate notes
        run: |
          # The prompt asks for release-notes.md; the final assistant message is the fallback
          # for a run that answered inline instead of writing the file.
          if [ ! -s release-notes.md ] && [ -s last-message.txt ]; then
            echo "::warning::Agent did not write release-notes.md, falling back to its final message."
            cp last-message.txt release-notes.md
          fi
          if [ ! -s release-notes.md ]; then
            echo "::error::No release notes were produced."
            exit 1
          fi
          # A whole-document code fence is the one formatting slip worth repairing here.
          FIRST=$(head -1 release-notes.md)
          case "$FIRST" in
            '```'*)
              sed -i '1d' release-notes.md
              [ "$(tail -1 release-notes.md)" = '```' ] && sed -i '$d' release-notes.md
              ;;
          esac

          {
            echo "### Release notes for \`${FROM_SHA:0:8}..${TO_SHA:0:8}\` ($COMMIT_COUNT commits)"
            echo
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload notes artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-notes${{ inputs.release_tag && format('-{0}', inputs.release_tag) || '' }}
          path: |
            release-notes.md
            commits.txt

      - name: Update release description
        if: inputs.release_tag != ''
        run: |
          gh release edit "$RELEASE_TAG" --repo ${{ github.repository }} --notes-file release-notes.md
          echo "Updated release $RELEASE_TAG"
