name: Release

# Packages and publishes a completed CI run to GitHub Releases via Velopack.
#
# Manually dispatched with the run id of a CI run (the "package" jobs upload one
# artifact per rid plus a version.txt artifact computed by nbgv at build time —
# the version published here is always the version of that original build).
#
# Runs as a matrix over the four rids; Velopack supports multiple jobs uploading
# to the same GitHub release (--merge). Each rid maps to a Velopack channel
# (win-x64, osx-arm64, ...), with a "-pre" suffix when publishing a pre-release.
# The app (UpdateService) follows whichever channel it was installed from.
#
# The draft release is created up-front by a single job rather than by whichever
# vpk job gets there first: concurrent jobs would each fail to see the others'
# in-flight release and create duplicates. The matrix jobs then only ever merge
# into that existing draft (--publish false), and a final job flips the draft to
# published once every rid has succeeded.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "CI run id to publish (must have package + version artifacts)"
        required: true
        type: string
      prerelease:
        description: "Publish as a pre-release (uses -pre channels)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  # creates the draft release the matrix jobs upload into, so that no two vpk
  # jobs try to create it at once.
  draft:
    name: create draft
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.create.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Create draft release
        id: create
        run: |
          gh run download ${{ inputs.run_id }} --repo ${{ github.repository }} -n version -D version-artifact
          VERSION=$(tr -d '[:space:]' < version-artifact/version.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # a leftover draft is from a failed run, so start clean - vpk refuses to
          # merge into a release that already has an index for its channel. gh
          # resolves drafts by their pending tag name, so no tag exists to clean up.
          if IS_DRAFT=$(gh release view "$VERSION" --repo ${{ github.repository }} --json isDraft -q .isDraft 2>/dev/null); then
            if [ "$IS_DRAFT" != "true" ]; then
              echo "::error::Release $VERSION is already published, refusing to overwrite it."
              exit 1
            fi
            echo "Deleting leftover draft release $VERSION"
            gh release delete "$VERSION" --repo ${{ github.repository }} --yes
          fi

          PRE=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then PRE="--prerelease"; fi
          gh release create "$VERSION" --repo ${{ github.repository }} \
            --draft --title "$VERSION" --notes "" $PRE
          echo "Created draft release $VERSION"

      # give the release a chance to become visible to the api the vpk jobs use
      # to look it up, otherwise they may not find it and create a duplicate.
      - name: Wait for release to settle
        run: sleep 60

  release:
    name: release (${{ matrix.rid }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-arm64
            os: windows-latest
          - rid: osx-x64
            os: macos-15
          - rid: osx-arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO_URL: https://github.com/${{ github.repository }}
      VERSION: ${{ needs.draft.outputs.version }}
    steps:
      # only needed for the packaging icon
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install vpk
        run: dotnet tool install -g vpk
        shell: bash

      - name: Download build artifacts
        run: |
          CHANNEL="${{ matrix.rid }}"
          if [ "${{ inputs.prerelease }}" = "true" ]; then CHANNEL="$CHANNEL-pre"; fi
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"

          if [ "${{ runner.os }}" = "macOS" ]; then
            # the macOS artifact is a zip (preserves unix file modes)
            gh run download ${{ inputs.run_id }} --repo ${{ github.repository }} -n clowd-${{ matrix.rid }} -D package
            unzip -q "package/clowd-${{ matrix.rid }}.zip" -d publish
          else
            gh run download ${{ inputs.run_id }} --repo ${{ github.repository }} -n clowd-${{ matrix.rid }} -D publish
          fi
          echo "Publishing version $VERSION to channel $CHANNEL"
        shell: bash

      # fetch the previous release for this channel so vpk can build delta packages;
      # fails harmlessly on the very first release of a channel.
      - name: Download previous release (deltas)
        run: >
          vpk download github --repoUrl "$REPO_URL" --token "$GH_TOKEN"
          --channel "$CHANNEL" --pre ${{ inputs.prerelease }} -o releases
          || echo "No previous release found for channel $CHANNEL (first release?)"
        shell: bash

      - name: Pack (Windows)
        if: runner.os == 'Windows'
        run: >
          vpk pack --packId Clowd --packTitle Clowd --packAuthors "Caelan Sayler"
          --packVersion "$VERSION" --packDir publish --mainExe Clowd.Ui.exe
          --runtime ${{ matrix.rid }} --channel "$CHANNEL" -o releases
          --icon clowd_ui/Clowd.Ui/Assets/clowd-default.ico
        shell: bash

      # velopack signs + notarizes the .app and .pkg during pack (codesign/notarytool)
      # using a throwaway keychain built from repo secrets. The p12 certificates were
      # exported without a password, hence the empty -P. Identity names are discovered
      # from the imported certs (team-id suffix stripped, as vpk requires).
      - name: Install Apple certificates and notary profile
        if: runner.os == 'macOS'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          INSTALLER_CERTIFICATE_BASE64: ${{ secrets.INSTALLER_CERTIFICATE_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM: ${{ secrets.APPLE_TEAM }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_BUILD_PATH=$RUNNER_TEMP/build_certificate.p12
          CERT_INSTALLER_PATH=$RUNNER_TEMP/installer_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_BUILD_PATH"
          echo -n "$INSTALLER_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_INSTALLER_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_BUILD_PATH" -P "" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security import "$CERT_INSTALLER_PATH" -P "" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          xcrun notarytool store-credentials --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM" \
            --password "$APPLE_PASSWORD" --keychain "$KEYCHAIN_PATH" velopack-profile

          # discover the exact identity names; vpk wants them without the "(TEAMID)" suffix
          APP_IDENTITY=$(security find-identity -v "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1 | sed 's/ ([A-Z0-9]*)$//')
          INSTALL_IDENTITY=$(security find-identity -v "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Installer: [^"]*\)".*/\1/p' | head -1 | sed 's/ ([A-Z0-9]*)$//')
          if [ -z "$APP_IDENTITY" ] || [ -z "$INSTALL_IDENTITY" ]; then
            echo "Could not find signing identities in keychain:"
            security find-identity -v "$KEYCHAIN_PATH"
            exit 1
          fi
          echo "App identity:       $APP_IDENTITY"
          echo "Installer identity: $INSTALL_IDENTITY"
          echo "APP_IDENTITY=$APP_IDENTITY" >> "$GITHUB_ENV"
          echo "INSTALL_IDENTITY=$INSTALL_IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
        shell: bash

      - name: Pack (macOS)
        if: runner.os == 'macOS'
        run: >
          vpk pack --packId Clowd --packTitle Clowd --packAuthors "Caelan Sayler"
          --packVersion "$VERSION" --packDir publish --mainExe Clowd.Ui
          --runtime ${{ matrix.rid }} --channel "$CHANNEL" -o releases
          --icon clowd_ui/Clowd.Ui/Assets/clowd-default.icns
          --signAppIdentity "$APP_IDENTITY" --signInstallIdentity "$INSTALL_IDENTITY"
          --notaryProfile velopack-profile --keychain "$KEYCHAIN_PATH"
        shell: bash

      # merges into the draft created above (matched by tag) and leaves it a draft;
      # the publish job below flips it once every rid has uploaded.
      - name: Upload to GitHub Releases
        run: >
          vpk upload github --repoUrl "$REPO_URL" --token "$GH_TOKEN"
          --channel "$CHANNEL" -o releases
          --tag "$VERSION" --releaseName "$VERSION"
          --merge true --publish false --pre ${{ inputs.prerelease }}
        shell: bash

  publish:
    name: publish release
    needs: [draft, release]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.draft.outputs.version }}
    steps:
      - name: Publish draft release
        run: |
          gh release edit "$VERSION" --repo ${{ github.repository }} --draft=false
          echo "Published release $VERSION"
