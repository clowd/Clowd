[package]
name = "clowd_capture"
version = "0.0.0-local"
edition = "2021"

[dependencies]
anyhow = "1.0"
image = "0.25"
mouse-rs = "0.4"
euclid = "0.22.11"
windows = { version = "0.58", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_SystemInformation",
] }

rayon = "1.5"
num = "0.4.3"
bevy = { version = "0.15.0", features = ["bevy_gizmos"] }
bevy_prototype_lyon = { git = "https://github.com/Nilirad/bevy_prototype_lyon.git", rev = "0dacb384dcace5ce82f890b3b5cbdce2941ee461" }
iyes_perf_ui = { git = "https://github.com/IyesGames/iyes_perf_ui.git", rev = "d8f3cbb2ec486b85a86b21e1aa32dcebd26ac884" }
spin_sleep = "1.0"
raw-window-handle = "0.6"

[target.'cfg(target_os="macos")'.dependencies]
xcap = "0.1.0"

[build-dependencies]
winres = "0.1"
semver = "1.0"
