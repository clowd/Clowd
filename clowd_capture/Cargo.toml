[package]
name = "clowd_capture_wgpu"
version = "1.0.0"
edition = "2021"

[dependencies]
clowd_rust_core.workspace = true
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
image = { workspace = true, features = ["png", "jpeg"] }
libblur.workspace = true
euclid.workspace = true
log.workspace = true
simplelog.workspace = true
serde.workspace = true
serde_json.workspace = true
winit.workspace = true
handy-keys.workspace = true
bytemuck = { workspace = true, features = ["derive"] }
usvg.workspace = true
resvg.workspace = true
etagere.workspace = true
cosmic-text.workspace = true
arboard.workspace = true
rfd.workspace = true
xdialog = { workspace = true, features = ["win32-direct", "maccf-direct"] }
sentry.workspace = true

# Deliberately no OCR engine: recognition runs in the clowd_ai binary (`clowd_ai ocr`) so
# an abort or segfault inside ONNX Runtime cannot take a capture down, and its tens of MB
# of embedded models stay out of the overlay's start-up path.

[features]
# Windows-only parity build of the wgpu (DX12) gxi backend. Windows ships the
# d3d11 backend (src/gxi/d3d11); CI compiles this feature so the two backends'
# public surfaces cannot drift. Never enabled in shipped builds.
backend-wgpu = ["dep:wgpu", "dep:pollster"]

# The wgpu backend is the only backend off-Windows (macOS/Metal; the module
# cfg in src/gxi/mod.rs is `not(windows)`, so this table matches it exactly).
# "wgsl" enables the runtime WGSL frontend — the only shader path on macOS.
[target.'cfg(not(windows))'.dependencies]
wgpu = { workspace = true, features = ["metal", "wgsl"] }
pollster.workspace = true

[target.'cfg(windows)'.dependencies]
# Optional: only the backend-wgpu parity build compiles the wgpu backend on
# Windows (which consumes precompiled SM 5.1 DXBC via passthrough — see
# gxi/wgpu/shaders.rs and build.rs — but keeps "wgsl" on for its release
# fallback path).
wgpu = { workspace = true, features = ["dx12", "wgsl"], optional = true }
pollster = { workspace = true, optional = true }
windows = { workspace = true, features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    # SendInput / GetAsyncKeyState for the wheel injection and Esc poll (src/scroll/input.rs).
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    # The d3d11 gxi backend (src/gxi/d3d11): D3D11CreateDevice + resources,
    # D3D_DRIVER_TYPE/D3D_FEATURE_LEVEL/topology, DXGI formats + swapchain.
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    # SetThreadPriority / MMCSS / power throttling for the thread tiers
    # (src/system/mod.rs lower_thread_priority and friends).
    "Win32_System_Threading",
    # K32GetProcessMemoryInfo for the debug overlay process-RAM row.
    "Win32_System_ProcessStatus",
    # D3DKMTSetProcessSchedulingPriorityClass: GPU scheduler priority
    # (src/system/mod.rs raise_process_priority_class).
    "Wdk_Graphics_Direct3D",
    "Win32_System_SystemInformation",
] }

# `localtime_r` for the save dialog's filename pattern — the Windows build gets
# the same from `GetLocalTime` (Win32_System_SystemInformation, above).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
foreign-types.workspace = true
objc2-core-graphics = { workspace = true, features = ["objc2", "CGImage"] }
core-graphics.workspace = true
core-foundation.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
objc2-quartz-core = { workspace = true, features = ["CALayer", "CAAnimation", "CAMediaTiming", "CAMediaTimingFunction", "objc2-core-foundation"] }
block2.workspace = true

# naga version must match what wgpu 30.0 uses internally
[target.'cfg(windows)'.build-dependencies]
naga = { workspace = true, features = ["wgsl-in", "hlsl-out"] }
libloading.workspace = true
