[package]
name = "clowd_capture_wgpu"
version = "1.0.0"
edition = "2021"

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
image = { workspace = true, features = ["png", "jpeg"] }
libblur.workspace = true
euclid.workspace = true
log.workspace = true
simplelog.workspace = true
serde.workspace = true
serde_json.workspace = true
winit.workspace = true
wgpu = { workspace = true, features = ["dx12", "metal", "wgsl"] }
pollster.workspace = true
bytemuck = { workspace = true, features = ["derive"] }
usvg.workspace = true
resvg.workspace = true
etagere.workspace = true
glyphon.workspace = true
arboard.workspace = true
rfd.workspace = true
xdialog = { workspace = true, features = ["win32-direct", "maccf-direct"] }
sentry.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    # SendInput / GetAsyncKeyState — the scrolling-capture driver's wheel
    # injection and Esc poll (src/scroll/input.rs).
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
foreign-types.workspace = true
objc2-core-graphics = { workspace = true, features = ["objc2", "CGImage"] }
core-graphics.workspace = true
core-foundation.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
objc2-quartz-core = { workspace = true, features = ["CALayer", "CAAnimation", "CAMediaTiming", "CAMediaTimingFunction", "objc2-core-foundation"] }
block2.workspace = true
