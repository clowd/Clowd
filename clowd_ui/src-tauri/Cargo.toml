[package]
name = "clowd_ui"
version = "0.1.0"
description = "Clowd screen capture and editor"
authors = ["you"]
edition = "2021"

[dependencies]
anyhow = "1"
log = "0.4"
tauri = { version = "2", features = [
    "common-controls-v6",
    "image-ico",
    "image-png",
    "tray-icon",
] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lazy_static = "1"
chrono = "0.4.39"
rfd = "0.15.1"
arboard = "3.4.1"
dirs = "5.0.1"
global-hotkey = { version = "0.6.3", features = ["serde"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
