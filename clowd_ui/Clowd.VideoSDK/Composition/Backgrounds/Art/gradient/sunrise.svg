<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <title>Ribbon Sunrise</title>
  <defs>
    <linearGradient id="field" x1="0.1" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#0b4f52"/>
      <stop offset="0.28" stop-color="#0f6a63"/>
      <stop offset="0.52" stop-color="#b52f66"/>
      <stop offset="0.78" stop-color="#e0245f"/>
      <stop offset="1" stop-color="#c41340"/>
    </linearGradient>
    <radialGradient id="teal" gradientUnits="userSpaceOnUse" cx="240" cy="120" r="820">
      <stop offset="0" stop-color="#12d6b0" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#0e8f8c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0b4f52" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hot" gradientUnits="userSpaceOnUse" cx="1420" cy="880" r="900">
      <stop offset="0" stop-color="#ff2f6d" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#d61446" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#a80f38" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#field)"/>
  <rect width="1600" height="1000" fill="url(#teal)"/>
  <rect width="1600" height="1000" fill="url(#hot)"/>

  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.05" style="mix-blend-mode:overlay"/>
</svg>
