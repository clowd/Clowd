<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <title>Abyss Mesh</title>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#0d1330"/>
      <stop offset="0.5" stop-color="#12305c"/>
      <stop offset="1" stop-color="#0c5a72"/>
    </linearGradient>
    <radialGradient id="b0" gradientUnits="userSpaceOnUse" cx="820" cy="60" r="900">
      <stop offset="0" stop-color="#070a1e" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#070a1e" stop-opacity="0.405"/>
      <stop offset="1" stop-color="#070a1e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b1" gradientUnits="userSpaceOnUse" cx="240" cy="940" r="880">
      <stop offset="0" stop-color="#18e0b4" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#18e0b4" stop-opacity="0.383"/>
      <stop offset="1" stop-color="#18e0b4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b2" gradientUnits="userSpaceOnUse" cx="1120" cy="900" r="760">
      <stop offset="0" stop-color="#0fa8cc" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#0fa8cc" stop-opacity="0.338"/>
      <stop offset="1" stop-color="#0fa8cc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b3" gradientUnits="userSpaceOnUse" cx="1500" cy="320" r="620">
      <stop offset="0" stop-color="#1a3f8c" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#1a3f8c" stop-opacity="0.225"/>
      <stop offset="1" stop-color="#1a3f8c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b4" gradientUnits="userSpaceOnUse" cx="640" cy="620" r="520">
      <stop offset="0" stop-color="#0e7f96" stop-opacity="0.35"/>
      <stop offset="0.45" stop-color="#0e7f96" stop-opacity="0.158"/>
      <stop offset="1" stop-color="#0e7f96" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#base)"/>
  <circle cx="820" cy="60" r="900" fill="url(#b0)"/>
  <circle cx="240" cy="940" r="880" fill="url(#b1)"/>
  <circle cx="1120" cy="900" r="760" fill="url(#b2)"/>
  <circle cx="1500" cy="320" r="620" fill="url(#b3)"/>
  <circle cx="640" cy="620" r="520" fill="url(#b4)"/>

  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.05" style="mix-blend-mode:overlay"/>
</svg>
