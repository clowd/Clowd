<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <title>Midnight Bloom</title>
  <defs>
    <linearGradient id="base" x1="0.1" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0a33"/>
      <stop offset="0.55" stop-color="#2b1052"/>
      <stop offset="1" stop-color="#3a1466"/>
    </linearGradient>
    <radialGradient id="b0" gradientUnits="userSpaceOnUse" cx="1440" cy="80" r="900">
      <stop offset="0" stop-color="#0a0418" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#0a0418" stop-opacity="0.427"/>
      <stop offset="1" stop-color="#0a0418" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b1" gradientUnits="userSpaceOnUse" cx="300" cy="980" r="880">
      <stop offset="0" stop-color="#d92fa8" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#d92fa8" stop-opacity="0.383"/>
      <stop offset="1" stop-color="#d92fa8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b2" gradientUnits="userSpaceOnUse" cx="720" cy="700" r="620">
      <stop offset="0" stop-color="#7a1fb0" stop-opacity="0.6"/>
      <stop offset="0.45" stop-color="#7a1fb0" stop-opacity="0.27"/>
      <stop offset="1" stop-color="#7a1fb0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b3" gradientUnits="userSpaceOnUse" cx="120" cy="200" r="560">
      <stop offset="0" stop-color="#2f1470" stop-opacity="0.7"/>
      <stop offset="0.45" stop-color="#2f1470" stop-opacity="0.315"/>
      <stop offset="1" stop-color="#2f1470" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b4" gradientUnits="userSpaceOnUse" cx="1300" cy="860" r="520">
      <stop offset="0" stop-color="#8f2ac0" stop-opacity="0.35"/>
      <stop offset="0.45" stop-color="#8f2ac0" stop-opacity="0.158"/>
      <stop offset="1" stop-color="#8f2ac0" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#base)"/>
  <circle cx="1440" cy="80" r="900" fill="url(#b0)"/>
  <circle cx="300" cy="980" r="880" fill="url(#b1)"/>
  <circle cx="720" cy="700" r="620" fill="url(#b2)"/>
  <circle cx="120" cy="200" r="560" fill="url(#b3)"/>
  <circle cx="1300" cy="860" r="520" fill="url(#b4)"/>

  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.06" style="mix-blend-mode:overlay"/>
</svg>
