<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <title>Orchid Mesh</title>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f472d8"/>
      <stop offset="0.5" stop-color="#b35ce8"/>
      <stop offset="1" stop-color="#7a3fd6"/>
    </linearGradient>
    <radialGradient id="b0" gradientUnits="userSpaceOnUse" cx="220" cy="140" r="860">
      <stop offset="0" stop-color="#ffa2e8" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ffa2e8" stop-opacity="0.427"/>
      <stop offset="1" stop-color="#ffa2e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b1" gradientUnits="userSpaceOnUse" cx="1420" cy="900" r="880">
      <stop offset="0" stop-color="#5f2fc0" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#5f2fc0" stop-opacity="0.405"/>
      <stop offset="1" stop-color="#5f2fc0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b2" gradientUnits="userSpaceOnUse" cx="1400" cy="180" r="600">
      <stop offset="0" stop-color="#ffd0f2" stop-opacity="0.6"/>
      <stop offset="0.45" stop-color="#ffd0f2" stop-opacity="0.27"/>
      <stop offset="1" stop-color="#ffd0f2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b3" gradientUnits="userSpaceOnUse" cx="200" cy="920" r="640">
      <stop offset="0" stop-color="#c86af0" stop-opacity="0.7"/>
      <stop offset="0.45" stop-color="#c86af0" stop-opacity="0.315"/>
      <stop offset="1" stop-color="#c86af0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b4" gradientUnits="userSpaceOnUse" cx="820" cy="520" r="540">
      <stop offset="0" stop-color="#e07ae8" stop-opacity="0.4"/>
      <stop offset="0.45" stop-color="#e07ae8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#e07ae8" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#base)"/>
  <circle cx="220" cy="140" r="860" fill="url(#b0)"/>
  <circle cx="1420" cy="900" r="880" fill="url(#b1)"/>
  <circle cx="1400" cy="180" r="600" fill="url(#b2)"/>
  <circle cx="200" cy="920" r="640" fill="url(#b3)"/>
  <circle cx="820" cy="520" r="540" fill="url(#b4)"/>

  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.05" style="mix-blend-mode:overlay"/>
</svg>
