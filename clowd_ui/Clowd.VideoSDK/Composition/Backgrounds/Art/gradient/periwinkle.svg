<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <title>Periwinkle Mesh</title>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f7ff0"/>
      <stop offset="0.55" stop-color="#8f7ceb"/>
      <stop offset="1" stop-color="#c39ae8"/>
    </linearGradient>
    <radialGradient id="b0" gradientUnits="userSpaceOnUse" cx="200" cy="120" r="860">
      <stop offset="0" stop-color="#5fa8ff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#5fa8ff" stop-opacity="0.427"/>
      <stop offset="1" stop-color="#5fa8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b1" gradientUnits="userSpaceOnUse" cx="1440" cy="880" r="880">
      <stop offset="0" stop-color="#d9a8f0" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#d9a8f0" stop-opacity="0.405"/>
      <stop offset="1" stop-color="#d9a8f0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b2" gradientUnits="userSpaceOnUse" cx="900" cy="500" r="620">
      <stop offset="0" stop-color="#8a6ce8" stop-opacity="0.6"/>
      <stop offset="0.45" stop-color="#8a6ce8" stop-opacity="0.27"/>
      <stop offset="1" stop-color="#8a6ce8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b3" gradientUnits="userSpaceOnUse" cx="140" cy="900" r="640">
      <stop offset="0" stop-color="#eaf0ff" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#eaf0ff" stop-opacity="0.225"/>
      <stop offset="1" stop-color="#eaf0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b4" gradientUnits="userSpaceOnUse" cx="1380" cy="140" r="520">
      <stop offset="0" stop-color="#6f8cf5" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#6f8cf5" stop-opacity="0.248"/>
      <stop offset="1" stop-color="#6f8cf5" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#base)"/>
  <circle cx="200" cy="120" r="860" fill="url(#b0)"/>
  <circle cx="1440" cy="880" r="880" fill="url(#b1)"/>
  <circle cx="900" cy="500" r="620" fill="url(#b2)"/>
  <circle cx="140" cy="900" r="640" fill="url(#b3)"/>
  <circle cx="1380" cy="140" r="520" fill="url(#b4)"/>

  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.05" style="mix-blend-mode:overlay"/>
</svg>
