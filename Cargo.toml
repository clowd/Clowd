[workspace]
resolver = "2"
members = [
    "clowd_capture",
    "clowd_ocr",
    "clowd_rust_core",
    "clowd_scroll_driver",
    "clowd_shell_ext",
    "clowd_tractnni",
]
# clowd_server is a standalone workers-rs crate (own [workspace], wasm target).
exclude = ["clowd_server"]

[workspace.package]
version = "0.0.0-local"
authors = ["Caelan Sayler <git@caesay.com>"]
repository = "https://github.com/clowd/Clowd"
keywords = ["update", "install", "velopack", "squirrel", "automatic-updates"]
categories = ["development-tools"]
license = "MIT"
edition = "2021"
rust-version = "1.89"

[workspace.dependencies]
# Shared by clowd_capture and clowd_scroll_driver: geometry, the session.json
# contract, exit codes, Sentry setup.
clowd_rust_core = { path = "clowd_rust_core" }
anyhow = "1.0"
clap = "4.6"
image = { version = "0.25", default-features = false }
libblur = "0.24"
euclid = "0.22"
log = "0.4"
simplelog = "0.12"
winit = "0.30"
wgpu = { version = "30.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# clowd_tractnni's inference runtime. load-dynamic rather than linking: the ONNX
# Runtime dylib ships beside the binary (CI downloads the official release per
# target) and a machine where it is missing degrades to a named exit code
# instead of a binary that cannot start.
ort = { version = "2.0.0-rc.13", default-features = false, features = ["load-dynamic", "ndarray"] }
# clowd_tractnni's STFT/ISTFT for the 48 kHz denoiser.
realfft = "3.5"
pollster = "1.0"
bytemuck = "1"
usvg = { version = "0.47", default-features = false }
resvg = { version = "0.47", default-features = false }
etagere = "0.3"
glyphon = "0.12"
arboard = "3.6"
rfd = { version = "0.17", default-features = false }
xdialog = "3.1"
windows = "0.62"
foreign-types = "0.5"
core-graphics = "0.25"
core-foundation = "0.10"
objc2 = "0.6"
objc2-core-graphics = "0.3"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-quartz-core = "0.3"
block2 = "0.6"
# rustls keeps every target off OpenSSL/schannel, and debug-images/log/anyhow are what make the reports symbolicated and readable.
sentry = { version = "0.48", default-features = false, features = [
    "anyhow",
    "backtrace",
    "contexts",
    "debug-images",
    "log",
    "panic",
    "release-health",
    "reqwest",
    "rustls",
] }

[profile.release]
opt-level = 3
# Thin rather than fat: fat LTO's single-threaded link was ~70% of CI wall clock, and these binaries gain little from it (libblur runtime-dispatches its SIMD, wgpu work lands on the GPU, MNN is prebuilt C++).
lto = "thin"
# Line tables only, in a companion .pdb/.dSYM that CI uploads to Sentry — enough for readable stack traces, and the only split mode Windows-MSVC supports.
debug = 1
split-debuginfo = "packed"
debug-assertions = false
overflow-checks = false
incremental = false
# One unit per crate, so nothing is left to cross-unit inlining that the optimizer could have done directly.
codegen-units = 1
rpath = false
# panic stays at the default unwind so one render worker's panic cannot take the whole capture down.
