[workspace]
resolver = "2"
members = [
    "clowd_capture", "clowd_capture_wgpu",
    "clowd_ui/src-tauri"
]

[workspace.package]
version = "0.0.0-local"
authors = ["Caelan Sayler <git@caesay.com>"]
repository = "https://github.com/clowd/Clowd"
keywords = ["update", "install", "velopack", "squirrel", "automatic-updates"]
categories = ["development-tools"]
license = "MIT"
edition = "2021"
rust-version = "1.75"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.25"
rayon = "1.5"
clap = { version = "4.5", features = ["derive"] }
euclid = "0.22"
num = "0.4"
bevy = { version = "0.16.1", default-features = false }
# bevy_prototype_lyon = { git = "https://github.com/Nilirad/bevy_prototype_lyon.git", rev = "0602a0937b7dc6bfbdce53ae364b38e1a155d5de" }
bevy_prototype_lyon = { git = "https://github.com/rparrett/bevy_prototype_lyon", branch = "fix-dynamic-examples" }
iyes_perf_ui = "0.5"
resvg = "0.45"
windows = "0.61"
raw-window-handle = "0.6"
spin_sleep = "1.0"
rfd = "0.15"
arboard = "3.4"
dirs = "6.0"
chrono = "0.4"
urlencoding = "2.1"
base64 = "0.22"
tauri = "2"
tauri-plugin-opener = "2"
tauri-build = "2"
log = "0.4"
lazy_static = "1.5"
global-hotkey = "0.7"
xcap = "0.6"
mouse-rs = "0.4"
winres = "0.1"
semver = "1.0"

# default to small, optimized workspace release binaries
[profile.release]
opt-level = 3            # optimize for performance
lto = true               # link-time optimization
debug = false            # disable debug info
debug-assertions = false # disable debug assertions
overflow-checks = false  # disable overflow checks
panic = "abort"          # abort on panic
incremental = false      # disable incremental compilation
codegen-units = 1        # compile all code into a single unit
rpath = false            # disable rpath
