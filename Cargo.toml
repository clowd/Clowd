[workspace]
resolver = "2"
members = [
    "clowd_capture",
]
# clowd_server is a standalone workers-rs crate (own [workspace], wasm target).
exclude = ["clowd_server"]

[workspace.package]
version = "0.0.0-local"
authors = ["Caelan Sayler <git@caesay.com>"]
repository = "https://github.com/clowd/Clowd"
keywords = ["update", "install", "velopack", "squirrel", "automatic-updates"]
categories = ["development-tools"]
license = "MIT"
edition = "2021"
rust-version = "1.75"

[workspace.dependencies]
anyhow = "1.0"
clap = "4.6"
image = { version = "0.25", default-features = false }
euclid = "0.22"
log = "0.4"
simplelog = "0.12"
winit = "0.30"
wgpu = { version = "29.0", default-features = false }
pollster = "0.4"
bytemuck = "1"
usvg = { version = "0.47", default-features = false }
resvg = { version = "0.47", default-features = false }
etagere = "0.3"
glyphon = "0.11"
arboard = "3.4"
rfd = { version = "0.17", default-features = false }
xdialog = "2.1"
windows = "0.62"
foreign-types = "0.5"
core-graphics = "0.25"
core-foundation = "0.10"
objc2 = "0.6"
objc2-core-graphics = "0.3"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-quartz-core = "0.3"
block2 = "0.6"
naga = "29.0"
libloading = "0.9"
# rustls rather than the default native-tls: keeps the capturer off OpenSSL/schannel and
# builds identically on every target we ship.
sentry = { version = "0.48", default-features = false, features = [
    "backtrace",
    "contexts",
    "panic",
    "reqwest",
    "rustls",
] }

# default to small, optimized workspace release binaries
[profile.release]
opt-level = 3            # optimize for performance
lto = true               # link-time optimization
debug = false            # disable debug info
debug-assertions = false # disable debug assertions
overflow-checks = false  # disable overflow checks
panic = "abort"          # abort on panic
incremental = false      # disable incremental compilation
codegen-units = 1        # compile all code into a single unit
rpath = false            # disable rpath
