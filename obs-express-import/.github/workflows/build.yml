name: Build

# Reusable build matrix: Windows and macOS, each for x64 and arm64. Called by
# ci.yml (on push / PR) and release.yml (after the version bump). Every variant
# uploads an `obs-express-<os>-<arch>` artifact containing the zipped bundle
# (`obs-express-<os>-<arch>.zip`, members at the archive root) that the release
# job attaches to the GitHub Release unchanged.
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (defaults to the triggering ref)
        required: false
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Windows: VS 2022 generator (-A per arch), obs-sys builds libobs into
  # target/obs-<arch>, and the obs-express build.rs assembles a self-contained
  # runtime tree in target/release. That whole tree, zipped, is the artifact.
  # Each arch builds natively on its matching runner (windows-2022 = x64,
  # windows-11-arm = arm64), so no --target / cross toolchain is needed.
  # ---------------------------------------------------------------------------
  windows:
    name: Build (Windows ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows-latest now points at the VS 2026 image (no VS 17), so pin
          # windows-2022 which still ships VS 2022 Enterprise for the
          # "Visual Studio 17 2022" generator.
          - arch: x64
            runner: windows-2022
          - arch: arm64
            runner: windows-11-arm
    defaults:
      run:
        shell: pwsh
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - name: Checkout (recursive submodules)
        uses: actions/checkout@v7
        with:
          # obs-studio must be recursive: obs-browser / obs-websocket submodule
          # dirs must EXIST even though disabled, or their CMakeLists FATAL_ERROR.
          submodules: recursive
          ref: ${{ inputs.ref }}

      - name: Record OBS submodule SHA
        id: obs
        run: |
          $sha = git -C obs-studio rev-parse HEAD
          "sha=$sha" >> $env:GITHUB_OUTPUT
          Write-Host "OBS submodule SHA: $sha"

      # OBS derives its version from `git describe --tags`. CI submodule
      # checkouts have no tags, so OBS falls back to the short commit hash
      # (`fb4d98b`) — not a valid MAJOR.MINOR.PATCH. The top-level build gets
      # -DOBS_VERSION_OVERRIDE, but OBS's windows/architecture.cmake spawns
      # *child* CMake configures (build_x86, and build_x64 for the ARM64 parent)
      # that ignore that cache var and re-run `git describe`. HEAD is exactly the
      # 32.1.2 release commit, so a lightweight tag makes it resolve everywhere.
      - name: Tag OBS submodule for versioning
        run: git -C obs-studio tag -f 32.1.2

      - name: Toolchain diagnostics
        run: |
          cmake --version
          rustc --version
          cargo --version
          Write-Host "Target arch: ${{ matrix.arch }}"
          Write-Host "LIBCLANG_PATH=$env:LIBCLANG_PATH"
          if (Test-Path "$env:LIBCLANG_PATH\libclang.dll") {
            Write-Host "libclang.dll: found"
          } else {
            Write-Host "::warning::libclang.dll not found at LIBCLANG_PATH ($env:LIBCLANG_PATH) - bindgen may fail"
          }

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-${{ matrix.arch }}-cargo-

      # The native OBS build and its downloaded prebuilt deps (.deps) are cached
      # together under one arch-scoped key so they can never evict independently.
      # runner.os is "Windows" for both x64 and arm64, so the arch MUST be in the
      # key or the two builds would clobber each other's cache.
      - name: Cache OBS native build + prebuilt deps
        uses: actions/cache@v6
        with:
          path: |
            target/obs-${{ matrix.arch }}
            obs-studio/.deps
          key: ${{ runner.os }}-${{ matrix.arch }}-obs-${{ steps.obs.outputs.sha }}

      - name: Build (release)
        run: cargo build --release

      - name: Test (release, unit tests only)
        run: |
          # obs-express links obs.dll (import lib), so the test exe in
          # target/release/deps needs the runtime DLLs (assembled in
          # target/release) on PATH.
          $env:PATH = "$(Resolve-Path target/release);$env:PATH"
          cargo test --release -p obs-express
          # vid2gif links the bundled FFmpeg DLLs; its tests are fully
          # self-contained (repo fixtures + generated raw inputs + a GIF
          # byte-stream validator). ffmpeg-sys verifies linkage + ABI version.
          cargo test --release -p vid2gif
          cargo test --release -p ffmpeg-sys

      - name: Stage artifact
        run: |
          $dist = "dist/obs-express-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          # obs-express.exe plus the copied helpers and all runtime DLLs. *.pdb
          # is excluded by only matching *.exe / *.dll; cargo build junk stays
          # behind because we copy explicit top-level items only.
          Copy-Item target/release/*.exe $dist
          Copy-Item target/release/*.dll $dist
          if (Test-Path target/release/obs-plugins) { Copy-Item -Recurse target/release/obs-plugins $dist }
          if (Test-Path target/release/data)        { Copy-Item -Recurse target/release/data $dist }
          # vid2gif links the FFmpeg DLLs directly; it is a hard shipping
          # requirement on every platform (no separate ffmpeg.exe needed).
          foreach ($required in @("obs-express.exe","obs.dll","vid2gif.exe","avcodec-61.dll","avfilter-10.dll")) {
            if (-not (Test-Path "$dist/$required")) {
              Write-Host "::error::required binary missing from dist: $required"
              exit 1
            }
          }
          Write-Host "Staged contents:"
          Get-ChildItem $dist | Select-Object Name
          $mb = (Get-ChildItem -Recurse $dist | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host ("Total staged size: {0:N1} MB" -f $mb)

      # Archive in the build job so the artifact IS the release asset (the
      # macOS job must do this to survive upload-artifact; doing it here too
      # keeps release.yml a plain "attach what was downloaded"). Members sit at
      # the archive root, matching the previous release layout.
      - name: Archive bundle
        run: |
          $dist = "dist/obs-express-windows-${{ matrix.arch }}"
          Compress-Archive -Path "$dist/*" -DestinationPath "$dist.zip" -CompressionLevel Optimal
          Get-Item "$dist.zip" | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: obs-express-windows-${{ matrix.arch }}
          path: dist/obs-express-windows-${{ matrix.arch }}.zip
          if-no-files-found: error
          # Already a zip; re-deflating it only costs time.
          compression-level: 0

  # ---------------------------------------------------------------------------
  # macOS: Xcode generator, obs-sys builds libobs.framework. Both slices run on
  # the arm64 macos-latest runner; the x64 slice is cross-compiled via
  # `--target x86_64-apple-darwin` (build.rs forwards the arch to
  # CMAKE_OSX_ARCHITECTURES; OBS's macOS prebuilt deps are universal). The Stage
  # step assembles a self-contained, relocatable bundle (framework + graphics
  # modules + dep dylibs + plugins), rewrites rpaths to @executable_path, and
  # zips it with ditto (symlinks and modes intact) for upload.
  # ---------------------------------------------------------------------------
  macos:
    name: Build (macOS ${{ matrix.arch }})
    # macos-latest (not a pinned older image): OBS 32.1.2's CMake requires the
    # macOS 15.0 SDK (Xcode 16+). macos-14's default Xcode is 15.4 (SDK 14.5),
    # which is too low; macos-latest ships a current Xcode. Both the arm64
    # (native) and x64 (cross) slices run on this arm64 runner.
    runs-on: macos-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            triple: aarch64-apple-darwin
            target_flag: ""
            outdir: target/release
          - arch: x64
            triple: x86_64-apple-darwin
            target_flag: --target x86_64-apple-darwin
            outdir: target/x86_64-apple-darwin/release
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout (recursive submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ inputs.ref }}

      - name: Record OBS submodule SHA
        id: obs
        run: |
          sha=$(git -C obs-studio rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "OBS submodule SHA: $sha"

      # See the Windows job: give the tagless CI submodule a lightweight tag on
      # HEAD (the 32.1.2 release commit) so OBS's `git describe --tags` version
      # discovery resolves to a valid MAJOR.MINOR.PATCH.
      - name: Tag OBS submodule for versioning
        run: git -C obs-studio tag -f 32.1.2

      - name: Select full Xcode
        run: |
          # build.rs uses the Xcode generator + enable_language(Swift); the CLT
          # alone are not enough. macos-latest's default Xcode.app is current.
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          xcode-select -p
          xcodebuild -version

      - name: Ensure cmake (>= 3.28)
        run: |
          cmake --version || brew install cmake
          cmake --version

      - name: Add Rust target
        run: rustup target add ${{ matrix.triple }}

      - name: Toolchain diagnostics
        run: |
          rustc --version
          cargo --version
          clang --version
          echo "Target: ${{ matrix.triple }}"

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-${{ matrix.arch }}-cargo-

      # obs-sys has no build-dir override on macOS; the OBS build lands in the
      # obs-sys OUT_DIR, which is under the per-target output dir. Cache that
      # whole `out` dir together with the downloaded deps under one arch-scoped
      # key (runner.os is "macOS" for both slices, so arch must be in the key).
      - name: Cache OBS native build + prebuilt deps
        uses: actions/cache@v6
        with:
          path: |
            ${{ matrix.outdir }}/build/obs-sys-*/out
            obs-studio/.deps
          key: ${{ runner.os }}-${{ matrix.arch }}-obs-${{ steps.obs.outputs.sha }}

      - name: Build (release)
        run: cargo build --release ${{ matrix.target_flag }}

      - name: Test (release, unit tests only)
        # Only the arm64 slice is native to the arm64 runner; the x64 slice is
        # cross-compiled and cannot execute here (no Rosetta). The same unit
        # tests run on the arm64 mac and on both Windows arches, so coverage is
        # preserved.
        if: matrix.arch == 'arm64'
        run: |
          cargo test --release -p obs-express ${{ matrix.target_flag }}
          # vid2gif links the FFmpeg dylibs directly — its integration tests
          # are self-contained (repo fixtures + generated raw video inputs).
          cargo test --release -p vid2gif ${{ matrix.target_flag }}
          cargo test --release -p ffmpeg-sys ${{ matrix.target_flag }}

      - name: Stage artifact (self-contained bundle)
        run: |
          set -euo pipefail
          arch="${{ matrix.arch }}"
          outdir="${{ matrix.outdir }}"
          config=RelWithDebInfo
          dist="dist/obs-express-macos-$arch"
          rm -rf "$dist"; mkdir -p "$dist/Frameworks" "$dist/obs-plugins"

          # Locate the OBS build tree obs-sys assembled (OUT_DIR/obs-build).
          # Multiple obs-sys-<hash>/out/obs-build dirs can accumulate in the
          # restored cache as obs-sys/build.rs changes across commits, so pick the
          # newest one that actually holds the built framework.
          obs_build=""
          for cand in $(ls -dt "$outdir"/build/obs-sys-*/out/obs-build 2>/dev/null); do
            if [ -d "$cand/libobs/$config/libobs.framework" ]; then obs_build="$cand"; break; fi
          done
          echo "OBS build tree: ${obs_build:-<none found>}"
          test -n "$obs_build"

          # 1. Executables
          cp "$outdir/obs-express" "$dist/"
          [ -f "$outdir/obs-ffmpeg-mux" ] && cp "$outdir/obs-ffmpeg-mux" "$dist/" || true
          cp "$outdir/vid2gif" "$dist/"

          # 2. libobs.framework + Metal/OpenGL graphics modules
          cp -R "$obs_build/libobs/$config/libobs.framework" "$dist/Frameworks/"
          cp -a "$obs_build/libobs-metal/$config/"*.dylib "$dist/Frameworks/" 2>/dev/null || true
          cp -a "$obs_build/libobs-opengl/$config/"*.dylib "$dist/Frameworks/" 2>/dev/null || true

          # 3. Prebuilt dependency dylibs (FFmpeg, x264, ...). Taken from the
          #    profile dir, NOT from obs-studio/.deps: build.rs stages them
          #    there (stage_macos_dylibs) with an @loader_path rpath and a
          #    fresh ad-hoc signature, so they are self-resolving for any
          #    consumer that dlopens them, and the dev tree and this bundle
          #    carry byte-identical files. `cp -a` keeps the versioned aliases
          #    as symlinks (the Archive step preserves them).
          find "$outdir" -maxdepth 1 -name '*.dylib' -exec cp -a {} "$dist/Frameworks/" \;
          for required in libavcodec.dylib libavformat.dylib libavutil.dylib libx264.dylib; do
            if [ ! -e "$dist/Frameworks/$required" ]; then
              echo "::error::required dylib missing from dist (build.rs did not stage it): $required"
              exit 1
            fi
          done

          # 4. Plugins (.plugin bundles), preserving the <name>/RelWithDebInfo
          #    layout the runtime plugin-path template expects.
          for pdir in "$obs_build/plugins/"*/; do
            name=$(basename "$pdir")
            plug="$pdir$config/$name.plugin"
            if [ -d "$plug" ]; then
              mkdir -p "$dist/obs-plugins/$name/$config"
              cp -R "$plug" "$dist/obs-plugins/$name/$config/"
            fi
          done

          # 5. Relocate: add an @executable_path-relative rpath, drop the absolute
          #    build-tree rpaths, then ad-hoc re-sign (install_name_tool
          #    invalidates the signature on Apple Silicon).
          relocate() {
            local bin="$1"
            install_name_tool -add_rpath "@executable_path/Frameworks" "$bin" 2>/dev/null || true
            otool -l "$bin" | grep -A2 'cmd LC_RPATH' | awk '$1=="path"{print $2}' | while read -r rp; do
              case "$rp" in
                @*) : ;;
                *) install_name_tool -delete_rpath "$rp" "$bin" 2>/dev/null || true ;;
              esac
            done
            codesign --force --sign - "$bin" 2>/dev/null || true
          }
          relocate "$dist/obs-express"
          [ -f "$dist/obs-ffmpeg-mux" ] && relocate "$dist/obs-ffmpeg-mux" || true
          relocate "$dist/vid2gif"
          # Plugin binaries are dlopen'd by obs-express; @executable_path in them
          # resolves to obs-express, so the same rpath reaches the app Frameworks.
          find "$dist/obs-plugins" -type f -path '*/Contents/MacOS/*' | while read -r pb; do
            install_name_tool -add_rpath "@executable_path/Frameworks" "$pb" 2>/dev/null || true
            codesign --force --sign - "$pb" 2>/dev/null || true
          done

          cat > "$dist/README.txt" <<'EOF'
          obs-express (macOS, self-contained)

          libobs.framework, the Metal/OpenGL graphics modules, the FFmpeg/x264
          dylibs, and the OBS plugins are bundled alongside the binary. The
          executables carry an @executable_path/Frameworks rpath and the plugin
          path is resolved relative to obs-express at runtime, so this whole
          directory can be moved anywhere and run in place.

          The dylibs in Frameworks/ carry an @loader_path rpath, so they can
          also be dlopen'd directly (e.g. to use FFmpeg in-process) by any
          program, as long as they stay together in one directory.

          The binaries are ad-hoc signed (not notarized); first launch may need:
            xattr -dr com.apple.quarantine <this directory>
          EOF

          # 6. Verify relocation: relative rpaths only, no build-tree leakage.
          echo "=== obs-express LC_RPATH ==="
          otool -l "$dist/obs-express" | grep -A2 'cmd LC_RPATH' | awk '$1=="path"{print "  rpath:",$2}'
          if otool -l "$dist/obs-express" | grep -Eq "/Users/runner|obs-build|/\.deps/"; then
            echo "::error::obs-express still references an absolute build-tree path"
            otool -l "$dist/obs-express" | grep -E "/Users/runner|obs-build|/\.deps/" || true
            exit 1
          fi
          # 7. Verify vid2gif (links the bundled FFmpeg dylibs). The arm64
          #    slice runs a real conversion against a repo fixture; the
          #    cross-compiled x64 slice can only be checked for presence.
          test -f "$dist/vid2gif" || { echo "::error::vid2gif missing from dist"; exit 1; }
          if [ "$arch" = "arm64" ]; then
            "$dist/vid2gif" crates/vid2gif/tests/fixtures/clip.mp4 /tmp/vid2gif-smoke.gif --quality fair
            [ "$(head -c 6 /tmp/vid2gif-smoke.gif)" = "GIF89a" ]
            echo "vid2gif GIF toolchain OK"
          fi
          # 8. Verify the dep dylibs are self-resolving: @loader_path rpath and
          #    a valid signature on every real file (the symlink aliases resolve
          #    to them), and — on the native slice — an actual dlopen from a
          #    process that is NOT obs-express. libavformat has the widest
          #    @rpath fan-out in the payload (avcodec, swresample, avutil, rist,
          #    srt, mbedtls x3, x264), so if it loads, everything does.
          find "$dist/Frameworks" -maxdepth 1 -type f -name 'lib*.dylib' \
              ! -name 'libobs-*.dylib' | while read -r lib; do
            if ! otool -l "$lib" | grep -A2 'cmd LC_RPATH' | grep -q 'path @loader_path'; then
              echo "::error::$(basename "$lib") has no @loader_path rpath"; exit 1
            fi
            codesign -v "$lib" || { echo "::error::$(basename "$lib") signature invalid"; exit 1; }
          done
          if [ "$arch" = "arm64" ]; then
            python3 -c "import ctypes, sys; [ctypes.CDLL(p) for p in sys.argv[1:]]" \
              "$PWD/$dist/Frameworks/libavformat.dylib" \
              "$PWD/$dist/Frameworks/libavfilter.dylib" \
              "$PWD/$dist/Frameworks/libavdevice.dylib"
            echo "dep dylibs dlopen OK from a foreign host"
          fi

          echo "Frameworks:"; ls "$dist/Frameworks"
          echo "Plugins:";    ls "$dist/obs-plugins"
          echo "Bundle size:"; du -sh "$dist"

      # The staged tree is correct (755 executables, symlinked dylib aliases,
      # a symlinked libobs.framework), but actions/upload-artifact does not
      # preserve modes and follows symlinks, so uploading the tree ships 644
      # binaries, triplicated dylibs and a framework codesign rejects as
      # "bundle format is ambiguous". Archive here, upload the archive, and
      # release.yml attaches it as-is. ditto keeps symlinks and modes; no
      # --keepParent so members sit at the archive root (the layout consumers
      # already unzip into a directory of their own); --norsrc so no xattrs
      # become `._*` AppleDouble entries (embedded code signatures live in
      # the Mach-O, nothing here needs a resource fork).
      - name: Archive bundle
        run: |
          set -euo pipefail
          dist="dist/obs-express-macos-${{ matrix.arch }}"
          zip="$dist.zip"
          ditto -c -k --norsrc "$dist" "$zip"
          echo "symlink entries: $(zipinfo "$zip" | grep -c '^l' || true)"
          zipinfo "$zip" | grep -E ' (obs-express|vid2gif|obs-ffmpeg-mux)$'
          [ "$(zipinfo "$zip" | grep -c '^l')" -gt 0 ] || { echo "::error::archive lost its symlinks"; exit 1; }
          zipinfo "$zip" | grep -E ' obs-express$' | grep -q '^-rwx' || { echo "::error::archive lost the execute bit"; exit 1; }
          ls -la "$zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: obs-express-macos-${{ matrix.arch }}
          path: dist/obs-express-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
          # Already a zip; re-deflating it only costs time.
          compression-level: 0
