[workspace]
resolver = "2"
members = ["crates/obs-sys", "crates/obs", "crates/obs-express"]

[workspace.dependencies]
ctrlc = { version = "3", features = ["termination"] }
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_System_Threading",
    "Win32_System_Console",
] }
