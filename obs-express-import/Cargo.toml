[workspace]
resolver = "2"
members = [
    "crates/obs-sys",
    "crates/obs",
    "crates/obs-express",
    "crates/ffmpeg-sys",
    "crates/vid2gif",
]

[workspace.dependencies]
# Internal crates. Path deps declared once here; members inherit via
# `{ workspace = true }`. Paths are relative to the workspace root.
obs-sys = { path = "crates/obs-sys" }
obs = { path = "crates/obs" }
ffmpeg-sys = { path = "crates/ffmpeg-sys" }

# External crates. Versions (and shared feature sets) live here only; members
# declare `{ workspace = true }`.
anyhow = "1"
# base64 + png: the input-capture sidecar's `cursor_image` rows carry sprite
# planes as base64-encoded PNG (crates/obs-express/src/cursor_sprite.rs).
base64 = "0.23"
# 0.72+ required: bindgen 0.71 + libclang 22 intermittently emitted opaque
# 1-byte structs (vec2/vec3/vec4/obs_transform_info/obs_audio_data/
# obs_source_frame) whose layout asserts then fail with E0080. See the
# assert_no_opaque_regressions guard in crates/obs-sys/build.rs.
bindgen = "0.72"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
libc = "0.2"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    # GetCursorPos / GetAsyncKeyState: pointer sampling for --tracker.
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    # GetProcAddress: resolving user32!GetCursorFrameInfo (animated cursor
    # sprites — the export is undocumented, so it cannot be linked).
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Console",
    # CoInitializeEx / CoCreateInstance: endpoint-volume query for
    # --speaker-volume-compensation (the COM vtables are hand-rolled).
    "Win32_System_Com",
] }
