[workspace]
resolver = "2"
members = [
    "crates/obs-sys",
    "crates/obs",
    "crates/obs-platform",
    "crates/obs-express",
    "crates/obs-share-region",
    "crates/ffmpeg-sys",
    "crates/vid2gif",
]

[workspace.dependencies]
# Internal crates. Path deps declared once here; members inherit via
# `{ workspace = true }`. Paths are relative to the workspace root.
obs-sys = { path = "crates/obs-sys" }
obs = { path = "crates/obs" }
obs-platform = { path = "crates/obs-platform" }
ffmpeg-sys = { path = "crates/ffmpeg-sys" }

# External crates. Versions (and shared feature sets) live here only; members
# declare `{ workspace = true }`.
anyhow = "1"
# base64 + png: the input-capture sidecar's `cursor_image` rows carry sprite
# planes as base64-encoded PNG (crates/obs-express/src/cursor_sprite.rs).
base64 = "0.23"
# 0.72+ required: bindgen 0.71 + libclang 22 intermittently emitted opaque
# 1-byte structs (vec2/vec3/vec4/obs_transform_info/obs_audio_data/
# obs_source_frame) whose layout asserts then fail with E0080. See the
# assert_no_opaque_regressions guard in crates/obs-sys/build.rs.
bindgen = "0.72"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
libc = "0.2"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The `windows` crate on Windows and objc2 on macOS (SHARE_REGION_PLAN §5.2),
# matching the main Clowd workspace conventions. Sole Win32 binding now that
# the windows-sys interop was migrated.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    # GetModuleHandleW: the HINSTANCE for RegisterClassW/CreateWindowExW.
    "Win32_System_LibraryLoader",
    # ExitProcess / GetCurrentThreadId (obs-platform exit_process, input hooks).
    "Win32_System_Threading",
    # SetConsoleCtrlHandler (recorder.rs CTRL_CLOSE grace handling).
    "Win32_System_Console",
    # CoInitializeEx / CoCreateInstance + IMMDeviceEnumerator/IAudioEndpointVolume:
    # --speaker-volume-compensation endpoint-volume query (replaces the
    # hand-rolled COM vtables that windows-sys required).
    "Win32_System_Com",
    # IMMDevice::Activate's PROPVARIANT activation-params argument lives behind
    # these two gates in the generated bindings (we always pass None).
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
] }
objc2 = "0.6"
# CoreFoundation / CoreGraphics via the generated objc2 framework crates,
# replacing hand-rolled extern "C" declarations (interop cleanup). Feature
# lists name the headers actually used; extend additively as needed.
objc2-core-foundation = { version = "0.3", features = [
    "CFCGTypes",
    "CFString",
    "CFUUID",
    # Input hook (input_hook.rs): the event tap's CFMachPort + run-loop plumbing;
    # CFDate gates CFRunLoopRunInMode (CFTimeInterval lives in CFDate.h).
    "CFMachPort",
    "CFRunLoop",
    "CFDate",
] }
objc2-core-graphics = { version = "0.3", features = [
    "CGDirectDisplay",
    "CGDisplayConfiguration",
    "CGError",
    "CGEvent",
    "CGEventSource",
    "CGEventTypes",
    # CGCursorIsVisible (cursor sampling): deprecated since 10.9 but still the
    # only public answer; the binding also needs `libc` (boolean_t return).
    "CGRemoteOperation",
    "libc",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSResponder",
    "NSRunningApplication",
    "NSWindow",
    "NSView",
    "NSScreen",
    "NSEvent",
    "NSColor",
    "NSBezierPath",
    "NSGraphics",
    "NSGraphicsContext",
    "NSCursor",
    "NSTrackingArea",
    "NSImage",
    # Cursor sprite capture (platform/macos.rs): representation ladder + the
    # PNG encode via representationUsingType:properties:.
    "NSImageRep",
    "NSBitmapImageRep",
    # Methods taking CGFloat / NSRect / NSPoint (window init, bezier paths,
    # colorWithSRGBRed:...) are cfg-gated on this in the generated bindings.
    "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSGeometry",
    "NSNotification",
    "NSObject",
    "NSThread",
    # NSScreen.screens iteration (ui/appkit.rs work_areas()).
    "NSArray",
    "NSEnumerator",
    # The performWindowDrag commit poller (ui/appkit.rs): NSTimer +
    # NSTimeInterval (declared in NSDate.h).
    "NSTimer",
    "NSDate",
    # Cursor hashing / sprite encode (platform/macos.rs): TIFF / PNG NSData
    # bytes, plus the empty properties NSDictionary the encode call takes.
    "NSData",
    "NSDictionary",
] }
