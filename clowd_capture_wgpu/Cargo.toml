[package]
name = "clowd_capture_wgpu"
version = "1.0.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
image = "0.25"
euclid = "0.22"
log = "0.4"
simplelog = "0.12"
winit = "0.30"
wgpu = "29.0"
num = "0.4"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
usvg = { version = "0.47", default-features = false }
resvg = { version = "0.47", default-features = false }
tiny-skia = "0.12"
etagere = "0.3"
glyphon = "0.11"
arboard = "3.4"
rfd = "0.17"
xdialog = { version = "2.1", features = ["win32-direct", "maccf-direct"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
block2 = "0.6"