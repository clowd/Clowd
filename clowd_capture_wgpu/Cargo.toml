[package]
name = "clowd_capture_wgpu"
version = "1.0.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
image = "0.25"
euclid = "0.22"
log = "0.4"
simplelog = "0.12"
winit = "0.30"
wgpu = "29.0"
num = "0.4"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
resvg = { version = "0.47", default-features = false }
usvg = { version = "0.47", default-features = false }
tiny-skia = "0.12"
swash = "0.2"
arboard = "3.4"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
xdialog = { version = "2.0", features = ["win32-direct"] }

windows = { version = "0.62", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_SystemInformation",
] }

# Build dependencies removed - using nagac CLI for shader compilation