<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <title>Indigo Dusk</title>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0.9">
      <stop offset="0" stop-color="#3a2f96"/>
      <stop offset="0.55" stop-color="#5a44c4"/>
      <stop offset="1" stop-color="#7d5ae0"/>
    </linearGradient>
    <radialGradient id="b0" gradientUnits="userSpaceOnUse" cx="1420" cy="120" r="820">
      <stop offset="0" stop-color="#241a68" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#241a68" stop-opacity="0.405"/>
      <stop offset="1" stop-color="#241a68" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b1" gradientUnits="userSpaceOnUse" cx="240" cy="960" r="860">
      <stop offset="0" stop-color="#2fd0c8" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#2fd0c8" stop-opacity="0.225"/>
      <stop offset="1" stop-color="#2fd0c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b2" gradientUnits="userSpaceOnUse" cx="860" cy="460" r="660">
      <stop offset="0" stop-color="#8a66ea" stop-opacity="0.7"/>
      <stop offset="0.45" stop-color="#8a66ea" stop-opacity="0.315"/>
      <stop offset="1" stop-color="#8a66ea" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b3" gradientUnits="userSpaceOnUse" cx="140" cy="160" r="620">
      <stop offset="0" stop-color="#4a3ab0" stop-opacity="0.7"/>
      <stop offset="0.45" stop-color="#4a3ab0" stop-opacity="0.315"/>
      <stop offset="1" stop-color="#4a3ab0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b4" gradientUnits="userSpaceOnUse" cx="1440" cy="920" r="620">
      <stop offset="0" stop-color="#a978f0" stop-opacity="0.6"/>
      <stop offset="0.45" stop-color="#a978f0" stop-opacity="0.27"/>
      <stop offset="1" stop-color="#a978f0" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#base)"/>
  <circle cx="1420" cy="120" r="820" fill="url(#b0)"/>
  <circle cx="240" cy="960" r="860" fill="url(#b1)"/>
  <circle cx="860" cy="460" r="660" fill="url(#b2)"/>
  <circle cx="140" cy="160" r="620" fill="url(#b3)"/>
  <circle cx="1440" cy="920" r="620" fill="url(#b4)"/>

  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.05" style="mix-blend-mode:overlay"/>
</svg>
