# /IGNORE silences two unactionable link warnings (LNK4099: prebuilt native libs ship no pdbs; LNK4104: rustc cannot mark the COM exports PRIVATE), and crt-static drops the VC++ redist dependency for every binary.
# One exception: prisc_ai's build.rs swaps that binary back onto the dynamic CRT at link time (pyke's prebuilt ONNX Runtime libs are /MD), and CI ships msvcp140/vcruntime140 app-local beside it.
[target.'cfg(windows)']
rustflags = ["-Clink-arg=/IGNORE:4099", "-Clink-arg=/IGNORE:4104", "-Ctarget-feature=+crt-static"]

# v2 (SSE4.2, Nehalem 2009+) is clear for anything running a supported Windows or macOS, unlike v3 — Atom and Pentium Silver parts shipped without AVX2 into ~2021 and would SIGILL at launch.
[target.x86_64-pc-windows-msvc]
rustflags = ["-Ctarget-cpu=x86-64-v2"]

[target.x86_64-apple-darwin]
rustflags = ["-Ctarget-cpu=x86-64-v2"]

[alias]
r = "run -p prisc_capture"
b = "build -p prisc_capture"
rr = "run -p prisc_capture --release"
bb = "build -p prisc_capture --release"
# The recorder stack (libobs via CMake, 20-40 min cold) is outside default-members; these build it.
rec = "build -p prisc_recorder -p prisc_share_region -p prisc_vid2gif"
recr = "build --release -p prisc_recorder -p prisc_share_region -p prisc_vid2gif"
